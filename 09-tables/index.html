<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tables</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Monthly Expenses</h1>
  <table>
    <caption>Expense report - January</caption>
    <thead>
      <tr><th>Item</th><th>Category</th><th>Amount (Rs.)</th></tr>
    </thead>
    <tbody>
      <tr><td>Rent</td><td>Housing</td><td>8000</td></tr>
      <tr><td>Groceries</td><td>Food</td><td>3500</td></tr>
      <tr><td>Internet</td><td>Utilities</td><td>700</td></tr>
      <tr><td>Books</td><td>Education</td><td>1200</td></tr>
    </tbody>
    <tfoot>
      <tr><th colspan="2" scope="row">Total</th><td>13400</td></tr>
    </tfoot>
  </table>
</body>
</html>
