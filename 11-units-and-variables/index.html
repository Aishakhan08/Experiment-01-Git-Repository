<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Units and Variables</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Units &amp; CSS Variables</h1>
  <p class="px">16px - fixed pixel size</p>
  <p class="em">1.5em - parent ke font-size ke hisaab se</p>
  <p class="rem">2rem - root font-size ke hisaab se</p>
  <div class="percent">width: 50% of parent</div>
  <div class="vw">width: 60vw, height: 10vh</div>
  <button class="btn">Primary</button>
  <button class="btn btn-alt">Alternate</button>
</body>
</html>
