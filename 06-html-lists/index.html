<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Lists</title>
</head>
<body>
  <h1>Types of HTML Lists</h1>

  <h2>Unordered list</h2>
  <ul>
    <li>Apple</li>
    <li>Banana</li>
    <li>Mango</li>
  </ul>

  <h2>Ordered list</h2>
  <ol>
    <li>Wake up</li>
    <li>Code</li>
    <li>Sleep</li>
  </ol>
  <ol type="A" start="3" reversed>
    <li>Custom type / start / reversed</li>
    <li>Second</li>
    <li>Third</li>
  </ol>

  <h2>Description list</h2>
  <dl>
    <dt>HTML</dt><dd>Page ka structure</dd>
    <dt>CSS</dt><dd>Page ka style</dd>
  </dl>

  <h2>Nested list</h2>
  <ul>
    <li>Frontend
      <ul>
        <li>HTML</li>
        <li>CSS</li>
      </ul>
    </li>
    <li>Backend</li>
  </ul>
</body>
</html>
