<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Flexbox Layouts</h1>
  <h2>Navbar (space-between)</h2>
  <nav class="navbar">
    <div class="logo">Logo</div>
    <ul class="links"><li>Home</li><li>About</li><li>Contact</li></ul>
  </nav>

  <h2>Row, centered</h2>
  <div class="row"><div>1</div><div>2</div><div>3</div></div>

  <h2>Wrap + gap</h2>
  <div class="wrap"><div>A</div><div>B</div><div>C</div><div>D</div><div>E</div><div>F</div></div>

  <h2>Perfect centering</h2>
  <div class="center"><div class="dot">Center</div></div>

  <h2>Column + flex-grow</h2>
  <div class="column"><div>Header</div><div class="grow">Grows</div><div>Footer</div></div>
</body>
</html>
