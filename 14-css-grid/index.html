<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Grid Layouts</h1>
  <h2>Equal columns</h2>
  <div class="grid-3"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>

  <h2>Page layout (grid-template-areas)</h2>
  <div class="layout">
    <header>Header</header>
    <aside>Sidebar</aside>
    <main>Main content</main>
    <footer>Footer</footer>
  </div>

  <h2>Auto-fit gallery</h2>
  <div class="gallery"><div>A</div><div>B</div><div>C</div><div>D</div><div>E</div></div>
</body>
</html>
